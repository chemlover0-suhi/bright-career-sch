<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Designed by Suhaib Showkat</title>
    <style>
        /* Reset margins and paddings */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Fullscreen background layout */
        body {
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
            
            /* Background image settings */
          <img src="ssss.jpg" alt="Background" class="fullscreen-bg"> 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            
            background-color: #0b0c10; 
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        /* Animated credit text */
        .credit-text {
            color: #ffffff;
            font-size: 3rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 4px;
            text-align: center;
            user-select: none;
            
            /* Apply combination of fade-in and pulsing glow animations */
            animation: fadeIn 1.5s ease-out forwards, pulseGlow 3s ease-in-out infinite alternate;
        }

        /* Animation 1: Smooth Entry Fade-In */
        @keyframes fadeIn {
            0% {
                opacity: 0;
                transform: translateY(20px);
                filter: blur(5px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
                filter: blur(0);
            }
        }

        /* Animation 2: Infinite Ambient Cyber Glow (Matches a coding/tech theme) */
        @keyframes pulseGlow {
            0% {
                text-shadow: 0 0 10px rgba(255, 255, 255, 0.4), 
                             0 0 20px rgba(0, 255, 100, 0.2);
            }
            100% {
                text-shadow: 0 0 15px rgba(255, 255, 255, 0.6), 
                             0 0 30px rgba(0, 255, 100, 0.6),
                             0 0 45px rgba(0, 255, 100, 0.3);
            }
        }
    </style>
</head>
<body>

    <div class="credit-text">
        Designed by Suhaib Showkat
    </div>

</body>
</html>
